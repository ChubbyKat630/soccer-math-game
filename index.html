<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const scene = document.getElementById('scene');
  const goalsRoot = document.getElementById('goals');
  const ball = document.getElementById('ball');
  const artwork = document.getElementById('ballArtwork');
  const shadow = document.getElementById('ballShadow');
  const aimGuide = document.getElementById('aimGuideline');
  const aimLine = document.getElementById('aimLine');
  const aimArrow = document.getElementById('aimArrow');
  const feedback = document.getElementById('feedback');
  const settingsLayer = document.getElementById('settingsLayer');
  const soundBtn = document.getElementById('soundBtn');
  const modeButtons = [...document.querySelectorAll('[data-mode]')];
  const START = {x:600, y:665};
  const GOAL_Y = 532;
  const goalCenters = [260, 600, 940];
  const goalColors = [
    {sign:'#ffb9cb', rim:'#ef7c9b', light:'#ffe3ea'},
    {sign:'#ffe08b', rim:'#eba752', light:'#fff2bc'},
    {sign:'#a9dbff', rim:'#69b8e6', light:'#e1f4ff'}
  ];
  let mode = 'add', deck = [], question = null, score = 0, questionNumber = 0;
  let correctGoal = 1, lastCorrectGoal = -1, lastTwoGoal = -1;
  let state = 'ready', pos = {...START}, drag = null, flightId = null, timeoutId = null, lastFrame = 0;
  let soundOn = true, audioCtx = null, spin = 0, tipDismissed = false, ballScale = 1;

  // All goal SVG is included in the document from the start.
  // This fixes iOS viewers that do not support dynamic innerHTML on SVG groups.
  const goalEls = Array.prototype.slice.call(goalsRoot.querySelectorAll('.goal'));
  if (goalEls.length !== 3) throw new Error('Goal markup not found');

  const rand = (n) => Math.floor(Math.random() * n);
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = rand(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }
  function buildDeck() {
    const tasks = [];
    const max = mode === 'easy' ? 5 : 10;
    for (let a = 1; a <= max; a++) {
      for (let b = 1; b <= max - a; b++) tasks.push({a, b, op:'+', answer:a+b});
    }
    // 5 以內只用 1～5 的加法；10 以內亦沒有超過 10 的答案
    if (mode === 'mix') {
      for (let a = 2; a <= 10; a++) {
        for (let b = 1; b <= a; b++) tasks.push({a, b, op:'−', answer:a-b});
      }
    }
    shuffle(tasks);
    // 防止下一輪剛好重覆上一題。
    if (question && tasks.length > 1 && sameTask(tasks[tasks.length-1],question)) {
      [tasks[0], tasks[tasks.length-1]] = [tasks[tasks.length-1], tasks[0]];
    }
    return tasks;
  }
  function sameTask(a,b) { return a && b && a.a===b.a && a.b===b.b && a.op===b.op; }
  function buildOptions(answer) {
    const limit = mode === 'easy' ? 5 : 10;
    const near = shuffle([-2,-1,1,2,-3,3]).map(d => answer+d).filter(n => n>=0 && n<=limit && n!==answer);
    const wrong = [];
    for (const n of near) { if (!wrong.includes(n)) wrong.push(n); if (wrong.length === 2) break; }
    if (wrong.length < 2) { for (let n = 0; n<=limit; n++) { if (n!==answer && !wrong.includes(n)) wrong.push(n); if (wrong.length === 2) break; } }
    let idx = rand(3);
    if (lastCorrectGoal === idx && lastTwoGoal === idx) idx = (idx + 1 + rand(2)) % 3;
    lastTwoGoal = lastCorrectGoal; lastCorrectGoal = idx;
    const options = [...wrong]; options.splice(idx, 0, answer);
    return {options, idx};
  }
  function nextQuestion() {
    if (!deck.length) deck = buildDeck();
    question = deck.pop();
    questionNumber += 1;
    document.getElementById('questionLabel').textContent = `第 ${questionNumber} 題・選出正確答案`;
    document.getElementById('questionText').textContent = `${question.a} ${question.op} ${question.b} = ?`;
    const {options, idx} = buildOptions(question.answer);
    correctGoal = idx;
    goalEls.forEach((g,i) => { g.querySelector('.goal-number').textContent = options[i]; g.dataset.answer = String(options[i]); g.classList.remove('aimed','shake'); });
    resetBall();
    state = 'ready';
  }
  function updateBall(x,y,scale=1) {
    pos.x = x; pos.y = y; ballScale = scale;
    // 背景按螢幕尺寸鋪滿，但足球必須保持 1:1 的正圓比例。
    const r = scene.getBoundingClientRect();
    const sy = r.height / 800;
    const circleXCorrection = r.width && r.height ? sy / (r.width/1200) : 1;
    // 手機橫向時依然要看得清楚足球：畫面高度較矮會稍為放大。
    const visualScale = scale * (sy > 0 ? Math.max(1,30/(44*sy)) : 1);
    ball.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${visualScale.toFixed(3)})`);
    artwork.setAttribute('transform', `scale(${circleXCorrection.toFixed(5)} 1) rotate(${spin.toFixed(1)})`);
    shadow.setAttribute('cx', String(x));
    shadow.setAttribute('cy', String(Math.min(726, y+39)));
    shadow.setAttribute('rx', String(44 * circleXCorrection * visualScale));
    shadow.setAttribute('opacity', String(state === 'flying' ? .15 : .32));
  }
  function resetBall() {
    cancelAnimationFrame(flightId); flightId = null;
    spin = 0; drag = null;
    ball.classList.remove('dragging');
    aimGuide.classList.remove('visible');
    goalEls.forEach(g => g.classList.remove('aimed','shake'));
    updateBall(START.x,START.y,1);
  }
  function svgPoint(e) {
    const p = scene.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const m = scene.getScreenCTM();
    if (!m) return {...START};
    const out = p.matrixTransform(m.inverse()); return {x:out.x,y:out.y};
  }
  function clamp(v,min,max) { return Math.min(max,Math.max(min,v)); }
  // 對孩子來說，龍門內任何位置放開也應該算射中。
  function goalAt(x, y) {
    if (y < 345 || y > GOAL_Y + 16) return -1;
    return goalCenters.findIndex(cx => Math.abs(x - cx) <= 145);
  }
  function aimFor(dx, dy) {
    if (dy >= -8) return {index:-1, x: START.x};
    const targetX = START.x + (GOAL_Y - START.y) * dx / dy;
    const index = goalCenters.findIndex(cx => Math.abs(targetX - cx) <= 153);
    return {x:targetX, index};
  }
  function highlight(index) { goalEls.forEach((g,i)=>g.classList.toggle('aimed',index===i)); }
  function updateAim() {
    if (!drag) return;
    const dx = pos.x - drag.startX, dy = pos.y - drag.startY;
    const directlyOverGoal = goalAt(pos.x,pos.y);
    if (directlyOverGoal !== -1) {
      highlight(directlyOverGoal);
      aimGuide.classList.remove('visible');
      return;
    }
    if (Math.hypot(dx,dy)<12 || dy>=-8) { aimGuide.classList.remove('visible'); highlight(-1); return; }
    const aim = aimFor(dx,dy);
    const x2 = clamp(aim.x,-200,1400);
    for (const line of [aimLine,aimArrow]) {
      line.setAttribute('x1',String(pos.x));line.setAttribute('y1',String(pos.y));
      line.setAttribute('x2',String(x2));line.setAttribute('y2',String(GOAL_Y));
    }
    aimGuide.classList.add('visible'); highlight(aim.index);
  }
  function beginDrag(e) {
    if (state!=='ready' || settingsLayer.classList.contains('show')) return;
    if (e.button !== undefined && e.button !== 0) return;
    const p=svgPoint(e);
    // 用手指點球時給予更大觸控範圍，避免必須精確觸碰小足球。
    const screen=scene.getBoundingClientRect();
    if (Math.hypot((p.x-pos.x)*screen.width/1200,(p.y-pos.y)*screen.height/800)>82) return;
    if (e.preventDefault) e.preventDefault();
    state='dragging';
    drag={id:e.pointerId,px:p.x,py:p.y,startX:pos.x,startY:pos.y};
    ball.classList.add('dragging');
    // 將捕捉設於 HTML div 而不是 SVG g；Android Chrome 上更穩定。
    if (e.pointerId !== undefined) {
      try { document.getElementById('game').setPointerCapture(e.pointerId); } catch (_) {}
    }
    if (!tipDismissed) {tipDismissed=true;document.getElementById('tip').classList.add('hidden');}
    if (soundOn) initAudio();
  }
  function moveDrag(e) {
    if(state!=='dragging'||!drag||drag.id!==e.pointerId) return;
    if (e.preventDefault) e.preventDefault();
    const p=svgPoint(e);
    const x=clamp(drag.startX+p.x-drag.px,44,1156);
    const y=clamp(drag.startY+p.y-drag.py,335,742);
    updateBall(x,y);updateAim();
  }
  function endDrag(e) {
    if(state!=='dragging'||!drag||drag.id!==e.pointerId) return;
    if (e.preventDefault) e.preventDefault();
    // 快速甩手也要取得手指放開前的最新位置。
    if(e.type!=='pointercancel' && e.type!=='touchcancel') moveDrag(e);
    const d=drag;
    ball.classList.remove('dragging');aimGuide.classList.remove('visible');highlight(-1);
    drag=null;
    try {
      const game=document.getElementById('game');
      if(e.pointerId!==undefined && game.hasPointerCapture(e.pointerId))game.releasePointerCapture(e.pointerId);
    } catch (_) {}
    if(e.type==='pointercancel'||e.type==='touchcancel'){resetBall();state='ready';return;}
    const dx=pos.x-d.startX,dy=pos.y-d.startY;
    const len=Math.hypot(dx,dy);
    if(len<14){resetBall();state='ready';showTip('👆 拖住足球，移到龍門再放手！');return;}
    const direct=goalAt(pos.x,pos.y);
    if(direct>=0){goalHit(direct);return;}
    if(pos.y<=GOAL_Y){missGoal();return;}
    if(dy>=-8){resetBall();state='ready';showTip('👆 向上面三個龍門劃線射門！');return;}
    // 不要求快甩：慢慢拖動再放手也會沿繪畫出的路線射出。
    const dirX=dx/len,dirY=dy/len;
    state='flying';lastFrame=performance.now();
    const startedAt=lastFrame,speed=960;
    const fly=now=>{
      if(state!=='flying')return;
      const dt=Math.min((now-lastFrame)/1000,.045);lastFrame=now;
      const oldY=pos.y,oldX=pos.x;
      spin+=dt*650;
      const newX=oldX+dirX*speed*dt,newY=oldY+dirY*speed*dt;
      const scale=clamp(1-(START.y-newY)*.0006,.76,1.12);
      updateBall(newX,newY,scale);
      if(oldY>GOAL_Y && newY<=GOAL_Y){
        const t=(GOAL_Y-oldY)/(newY-oldY);
        const impactX=oldX+(newX-oldX)*t;
        const idx=goalCenters.findIndex(cx=>Math.abs(impactX-cx)<=153);
        if(idx>=0){updateBall(impactX,GOAL_Y,.86);goalHit(idx);return;}
      }
      if(newY<330||newY>835||newX<-80||newX>1280||now-startedAt>1800){missGoal();return;}
      flightId=requestAnimationFrame(fly);
    };
    flightId=requestAnimationFrame(fly);
  }
  function showTip(message) {
    const tip=document.getElementById('tip'); tip.textContent=message;tip.classList.remove('hidden');
    clearTimeout(tip._timer); tip._timer=setTimeout(()=>tip.classList.add('hidden'),2400);
  }
  function initAudio() {
    try { if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();} if(audioCtx && audioCtx.state==='suspended')audioCtx.resume(); } catch(_) { audioCtx=null; }
  }
  function note(freq,duration=0.14,delay=0,type='sine') {
    if(!soundOn)return;
    try {
      initAudio(); if(!audioCtx)return;
      const t=audioCtx.currentTime+delay;
      const oscillator=audioCtx.createOscillator(),gain=audioCtx.createGain();
      oscillator.type=type;oscillator.frequency.setValueAtTime(freq,t);
      gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.065,t+.02);
      gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
      oscillator.connect(gain).connect(audioCtx.destination);oscillator.start(t);oscillator.stop(t+duration+.02);
    } catch(_) {}
  }
  function playSound(kind) {
    if(kind==='correct'){note(523,.18,0,'sine');note(659,.18,.12,'sine');note(784,.35,.24,'sine');}
    if(kind==='wrong'){note(392,.17,0,'sine');note(330,.27,.17,'sine');}
    if(kind==='miss'){note(400,.11,0,'triangle');}
  }
  function confettiBurst(index) {
    const colors=['#fff08d','#ff98af','#8ddef6','#fff','#b7f7a1','#f5baff'];
    const originX=goalCenters[index]/1200*window.innerWidth, originY=520/800*window.innerHeight;
    for(let i=0;i<30;i++) {
      const c=document.createElement('span'); c.className='confetti'; c.style.left=`${originX}px`;c.style.top=`${originY}px`;
      c.style.background=colors[rand(colors.length)];c.style.width=`${7+rand(10)}px`;c.style.height=`${7+rand(10)}px`;
      c.style.setProperty('--tx',`${rand(550)-275}px`);c.style.setProperty('--ty',`${rand(430)-250}px`);c.style.setProperty('--rot',`${rand(720)-360}deg`);
      document.getElementById('game').appendChild(c);setTimeout(()=>c.remove(),1300);
    }
  }
  function showFeedback(kind,emoji,title,noteText,delay,nextFn) {
    clearTimeout(timeoutId);
    state='feedback';
    feedback.className=`pop-layer ${kind}`;
    document.getElementById('feedbackEmoji').textContent=emoji;
    document.getElementById('feedbackTitle').textContent=title;
    document.getElementById('feedbackNote').textContent=noteText;
    requestAnimationFrame(()=>feedback.classList.add('show'));
    timeoutId=setTimeout(()=>{feedback.classList.remove('show');nextFn();},delay);
  }
  function goalHit(index) {
    cancelAnimationFrame(flightId); flightId=null;
    goalEls[index].classList.add('shake');
    if(index===correctGoal) {
      score+=1;
      document.getElementById('scoreNum').textContent=score;
      playSound('correct');confettiBurst(index);
      showFeedback('correct','🎉','太棒了！你答對了！',`好球！已經答對 ${score} 題 ⭐`,1450, nextQuestion);
    } else {
      playSound('wrong');
      showFeedback('wrong','💗','差一點！再試試吧❤️','再看看算式，這題還有機會！',1500,()=>{resetBall();state='ready';});
    }
  }
  function missGoal() {
    cancelAnimationFrame(flightId);flightId=null;
    playSound('miss');
    showFeedback('miss','⚽','再射一次！','瞄準龍門，向上甩球～',1150,()=>{resetBall();state='ready';});
  }
  function pauseForMenu() {
    clearTimeout(timeoutId);feedback.classList.remove('show');resetBall();state='paused';
    settingsLayer.classList.add('show');
  }
  function resumeFromMenu() { settingsLayer.classList.remove('show');state='ready';resetBall(); }
  function restartGame() { clearTimeout(timeoutId);feedback.classList.remove('show'); score=0;questionNumber=0;document.getElementById('scoreNum').textContent='0';deck=[];lastCorrectGoal=-1;lastTwoGoal=-1;nextQuestion(); }
  // On iOS, native touch events are more reliable for drawing while touching SVG.
  const isAppleTouch = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (window.PointerEvent && !isAppleTouch) {
    scene.addEventListener('pointerdown',beginDrag,{passive:false});
    const game=document.getElementById('game');
    game.addEventListener('pointermove',moveDrag,{passive:false});
    game.addEventListener('pointerup',endDrag,{passive:false});
    game.addEventListener('pointercancel',endDrag,{passive:false});
  } else {
    // 舊版 iPad Safari 後備：原生 touch 事件，避免觸控被當成捲頁。
    let touchId=null;
    const wrapTouch=(touch,type)=>({clientX:touch.clientX,clientY:touch.clientY,pointerId:touch.identifier,type,preventDefault:()=>{}});
    scene.addEventListener('touchstart',e=>{
      if(touchId!==null)return;
      const touch=e.changedTouches[0];if(!touch)return;
      beginDrag(wrapTouch(touch,'touchstart'));
      if(state==='dragging'){touchId=touch.identifier;e.preventDefault();}

    const activeTouch=(e)=>Array.from(e.changedTouches).find(t=>t.identifier===touchId);
    window.addEventListener('touchmove',e=>{if(touchId===null)return;const t=activeTouch(e);if(t){e.preventDefault();moveDrag(wrapTouch(t,'touchmove'));}},{passive:false});

    window.addEventListener('touchcancel',e=>{if(touchId===null)return;const t=activeTouch(e);if(t){endDrag(wrapTouch(t,'touchcancel'));touchId=null;}},{passive:false});
    scene.addEventListener('mousedown',beginDrag);
    window.addEventListener('mousemove',moveDrag);
    window.addEventListener('mouseup',endDrag);
  }
  window.addEventListener('resize',()=>updateBall(pos.x,pos.y,ballScale));
  ball.addEventListener('keydown',e=>{
    // 鍵盤使用者可透過箭嘴選擇方向，再用 Enter 射球。
    if(state!=='ready')return;
    if(['ArrowLeft','ArrowRight','ArrowUp','Enter',' '].includes(e.key)){
      e.preventDefault();
      let selected=Number(ball.dataset.keyboardGoal || '1');
      if(e.key==='ArrowLeft')selected=Math.max(0,selected-1);
      if(e.key==='ArrowRight')selected=Math.min(2,selected+1);
      ball.dataset.keyboardGoal=String(selected);highlight(selected);
      if(e.key==='Enter'||e.key===' '){highlight(-1);goalHit(selected);}
    }
  });
  document.getElementById('settingsBtn').addEventListener('click',pauseForMenu);
  document.getElementById('closeSettings').addEventListener('click',resumeFromMenu);
  document.getElementById('resetBtn').addEventListener('click',()=>{restartGame();resumeFromMenu();});
  modeButtons.forEach(button=>button.addEventListener('click',()=>{
    if(mode!==button.dataset.mode) {mode=button.dataset.mode;modeButtons.forEach(b=>b.classList.toggle('selected',b===button));restartGame();}
    resumeFromMenu();
  }));
  soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';soundBtn.setAttribute('aria-label',soundOn?'關閉音效':'開啟音效');if(soundOn)note(587,.12);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='dragging'){resetBall();state='ready';}});
  nextQuestion();
  document.documentElement.classList.add('game-ready');
})();
</script>
</body>
</html>
